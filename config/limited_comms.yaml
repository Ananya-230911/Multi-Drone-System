# Phase 3+: radio range 600 m, drones strung out in a line 450 m apart, so each
# drone only hears its neighbours. D1 detects and confirms GT-1; D4 never hears
# D1 directly. Agreement on the owner is reached through re-broadcasts (relay).

sim:
  duration: 120
  seed: 42

network:
  comm_range: 600
  latency: [0.05, 0.2]
  packet_loss: 0.05
  max_message_age: 5.0

drone_defaults:
  comm_range: 600

geofence:
  boundary: [[50, 50], [1950, 50], [1950, 1950], [50, 1950]]
  margin: 15
  altitude_limits: [15, 120]
  restricted_zones:
    - id: RZ-1
      polygon: [[800, 1400], [1100, 1400], [1100, 1700], [800, 1700]]   # away from the line

drones:
  - id: D1
    pos: [250, 950]
    alt: 60
    battery_pct: 0.90
    home: [250, 800, 0]
    patrol: [[250, 950, 60], [350, 950, 60], [350, 1050, 60], [250, 1050, 60]]
  - id: D2
    pos: [700, 950]
    alt: 60
    battery_pct: 0.90
    home: [700, 800, 0]
    patrol: [[700, 950, 60], [800, 950, 60], [800, 1050, 60], [700, 1050, 60]]
  - id: D3
    pos: [1150, 950]
    alt: 60
    battery_pct: 0.90
    home: [1150, 800, 0]
    patrol: [[1150, 950, 60], [1250, 950, 60], [1250, 1050, 60], [1150, 1050, 60]]
  - id: D4
    pos: [1600, 950]
    alt: 60
    battery_pct: 0.90
    home: [1600, 800, 0]
    patrol: [[1600, 950, 60], [1700, 950, 60], [1700, 1050, 60], [1600, 1050, 60]]

targets:
  - id: GT-1
    pos: [350, 1000]               # under D1's patrol
    alt: 0
    appear_at: 0
