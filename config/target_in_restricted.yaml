# Phase 2+: GT-1 sits inside restricted zone RZ-1, 15 m from its raw edge. D1 patrols
# just outside the zone and can see it from the edge, but nothing may fly over it.
# The hold point falls back to the zone edge, confidence stays low (about 0.3), and the
# record is REJECTED -> CANCELLED: it can never be inspected from outside the zone.
# At t = 20 s a cue points deep inside RZ-1: no drone has a valid inspection point,
# every bid is infeasible (no_inspection_point) and the task is CANCELLED with
# no_feasible_bidders.

sim:
  duration: 200
  seed: 42

geofence:
  boundary: [[50, 50], [1950, 50], [1950, 1950], [50, 1950]]
  margin: 15
  altitude_limits: [15, 120]
  restricted_zones:
    - id: RZ-1
      polygon: [[800, 600], [1100, 600], [1100, 1000], [800, 1000]]

drones:
  - id: D1
    pos: [1140, 500]
    alt: 60
    battery_pct: 0.90
    home: [100, 100, 0]
    patrol: [[1140, 500, 60], [1140, 1100, 60], [1500, 1100, 60], [1500, 500, 60]]   # 55 m from GT-1
  - id: D2
    pos: [300, 300]
    alt: 60
    battery_pct: 0.90
    home: [100, 100, 0]
    patrol: [[300, 300, 60], [600, 300, 60], [600, 500, 60], [300, 500, 60]]
  - id: D3
    pos: [1500, 1500]
    alt: 60
    battery_pct: 0.90
    home: [100, 100, 0]
    patrol: [[1500, 1500, 60], [1800, 1500, 60], [1800, 1800, 60], [1500, 1800, 60]]

targets:
  - id: GT-1
    pos: [1085, 800]
    alt: 0
    appear_at: 0

scenario_events:
  - {t: 20, type: external_cue, pos: [950, 800]}      # deep inside RZ-1
